<style>
/* Layout: one screen. A lanyard badge is the whole page; flip it and the links are printed on the back. */
:root {
  --ink: #07050d;
  --panel: #130f20;
  --line: #2a2142;
  --text: #fff7ff;
  --muted: #a99bc6;
  --pink: #ff2e93;
  --yellow: #ffe600;
  --cyan: #00e5ff;
  --lime: #b6ff00;
  --orange: #ff7a1a;
  --f-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font: 400 1rem/1.5 var(--f-body); overflow: hidden; overscroll-behavior: none; }
#stage, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#stage { z-index: 1; touch-action: none; }
#fx { z-index: 50; pointer-events: none; }
.blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blobs i { position: absolute; width: 38rem; height: 38rem; border-radius: 50%; filter: blur(90px); opacity: .32; animation: drift 14s ease-in-out infinite alternate; }
.blobs i:nth-child(1) { background: var(--pink); left: -10rem; top: -8rem; }
.blobs i:nth-child(2) { background: var(--cyan); right: -12rem; top: 30%; animation-delay: -5s; opacity: .2; }
.blobs i:nth-child(3) { background: var(--orange); left: 30%; bottom: -16rem; animation-delay: -9s; opacity: .2; }
@keyframes drift { to { transform: translate(6rem, 4rem) scale(1.2); } }
.bgword { position: fixed; inset: 0; z-index: 0; display: grid; place-items: center; text-align: center; pointer-events: none; font: 800 clamp(5rem, 22vw, 20rem)/.85 var(--f-display); letter-spacing: -.05em; color: transparent; -webkit-text-stroke: 2px color-mix(in srgb, var(--text) 10%, transparent); text-transform: uppercase; user-select: none; }

.top, .bar { position: fixed; left: 0; right: 0; z-index: 4; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-inline: 1.25rem; font: 500 .8rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.top { top: 0; padding-block: 1.1rem; }
.live { display: inline-flex; align-items: center; gap: .55rem; color: var(--lime); }
.live i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--lime); animation: ping 1.4s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 var(--lime); } 80%, 100% { box-shadow: 0 0 0 .8rem transparent; } }

.bar { bottom: 0; padding-block: 1rem; flex-wrap: wrap; justify-content: center; background: linear-gradient(0deg, var(--ink) 30%, transparent); pointer-events: none; }
.bar > * { pointer-events: auto; }
.hint { margin: 0; text-transform: none; letter-spacing: 0; font-size: .8rem; text-align: center; flex-basis: 100%; }
kbd { font: 500 .75rem var(--f-mono); border: 1px solid var(--muted); border-bottom-width: 3px; border-radius: .3rem; padding: .05rem .4rem; color: var(--text); }
.btn { font: 800 1rem var(--f-display); letter-spacing: -.01em; text-transform: none; padding: .8rem 1.5rem; border-radius: 99px; border: 2px solid var(--pink); color: var(--ink); background: var(--pink); cursor: pointer; transition: box-shadow .2s; }
.btn:hover, .btn:focus-visible { box-shadow: 0 0 0 6px color-mix(in srgb, var(--yellow) 55%, transparent), 0 0 40px var(--pink); }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--cyan); }
.edit { position: relative; }
.edit summary { list-style: none; }
.edit summary::-webkit-details-marker { display: none; }
.edit .panel { position: absolute; bottom: calc(100% + .7rem); left: 50%; transform: translateX(-50%); display: grid; gap: .6rem; width: min(86vw, 19rem); padding: .9rem; background: var(--panel); border: 2px solid var(--line); border-radius: .8rem; text-transform: none; letter-spacing: 0; }
.edit label { display: grid; gap: .25rem; font: 500 .7rem var(--f-mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.edit input { font: 500 1rem var(--f-body); color: var(--text); background: var(--ink); border: 2px solid var(--line); border-radius: .5rem; padding: .5rem .65rem; width: 100%; }
.edit input:focus-visible { outline: 3px solid var(--cyan); outline-offset: 1px; border-color: var(--cyan); }

/* The back of the badge: real links, laid over the 3D card and moved with it each frame. */
.bwrap { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
.back { position: absolute; left: 0; top: 0; width: 640px; height: 960px; visibility: hidden; pointer-events: none; will-change: transform; color: var(--text); }
.back h2 { position: absolute; left: 48px; right: 48px; top: 70px; margin: 0; display: flex; justify-content: space-between; font: 500 22px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--yellow); }
.back h2 span:last-child { color: rgba(255,255,255,.6); }
.links { position: absolute; left: 48px; right: 48px; top: 125px; display: grid; gap: 12px; }
.link { --c: var(--pink); position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 84px; padding: 0 28px; overflow: hidden; border: 3px solid var(--c); border-radius: 42px; color: var(--text); text-decoration: none; pointer-events: auto; background: rgba(10,10,14,.75); transition: color .2s, background .2s; }
.link .nm { font: 800 38px/1 var(--f-display); letter-spacing: -.02em; }
.link .tg { font: 500 17px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--c); margin-left: auto; margin-right: 10px; }
.link .ar { font: 500 30px var(--f-mono); color: var(--c); }
.link:hover, .link:focus-visible { background: var(--c); color: var(--ink); }
.link:hover .tg, .link:hover .ar, .link:focus-visible .tg, .link:focus-visible .ar { color: var(--ink); }
.link:focus-visible { outline: 4px solid var(--cyan); outline-offset: 3px; }
.mail { position: absolute; left: 48px; right: 48px; top: 800px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font: 500 18px var(--f-mono); color: rgba(255,255,255,.65); pointer-events: none; }
.mail code { color: var(--text); background: rgba(255,255,255,.08); border: 2px dashed var(--yellow); padding: 8px 12px; border-radius: 10px; font-size: 22px; pointer-events: auto; user-select: all; }
.mail button { font: 500 18px var(--f-mono); color: var(--ink); background: var(--yellow); border: 0; padding: 10px 18px; border-radius: 99px; cursor: pointer; pointer-events: auto; }

.fallback { display: none; position: fixed; inset: 0; z-index: 6; overflow: auto; padding: 5rem 1.25rem; place-content: center; gap: .75rem; }
.fallback h1 { font: 800 clamp(2.4rem, 10vw, 5rem)/.9 var(--f-display); margin: 0 0 1rem; letter-spacing: -.04em; }
.fallback .link { height: 4.2rem; max-width: 28rem; }

.cursor { position: fixed; left: 0; top: 0; z-index: 60; width: 2.2rem; height: 2.2rem; margin: -1.1rem 0 0 -1.1rem; border: 2px solid var(--yellow); border-radius: 50%; pointer-events: none; mix-blend-mode: difference; transition: width .2s, height .2s, margin .2s, background .2s; display: none; }
.cursor.big { width: 4.5rem; height: 4.5rem; margin: -2.25rem 0 0 -2.25rem; background: var(--yellow); }
.cursor.grab { width: 3.6rem; height: 3.6rem; margin: -1.8rem 0 0 -1.8rem; border-color: var(--pink); }
@media (pointer: fine) { .cursor { display: block; } body, a, button, summary { cursor: none; } }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; } }
</style>

<div class="bar">

    </div>

  <button class="btn ghost" id="reset" type="button">Reset</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine = window.matchMedia('(pointer: fine)').matches;
  var COLORS = ['#ff2e93', '#ffe600', '#00e5ff', '#b6ff00', '#ff7a1a', '#fff7ff'];

  }

  /* Warp + badge interaction hooks (filled in by the 3D section) */

  var hitBadge = function () { return false; }, startGrab = function () {}, endGrab = function () {}, flipBadge = function () {};
  var SKIP = 'a, button, summary, .edit, .back .mail';
  addEventListener('keydown', function (e) {
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;

  addEventListener('keyup', function (e) { if (e.code === 'Space') warpHold = false; });
  addEventListener('pointerdown', function (e) {

  }, { passive: false });

  /* ---------- 3D stage ---------- */
  var canvas = document.getElementById('stage');
  var renderer, ok = !!window.THREE;
  if (ok) { try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true }); } catch (e) { ok = false; } }
  if (!ok) { document.getElementById('fallback').style.display = 'grid'; document.querySelector('.bar').style.display = 'none'; return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(45, 1, .1, 200);
  cam.position.z = 9;

  var starGroup = new THREE.Group(); scene.add(starGroup);
  var N = 1000, SP = 60, sp = new Float32Array(N * 6), sx = new Float32Array(N), sy = new Float32Array(N), sz = new Float32Array(N), col = new Float32Array(N * 6);
  var pal = [[1, .18, .58], [1, .9, 0], [0, .9, 1], [.71, 1, 0], [1, 1, 1]];

  }

  var fire = mk(160, 240), firec = fire.getContext('2d');
  var mask = mk(TW, TH), detail = mk(TW, TH), back = mk(TW, TH);
  var STUB_Y = TH * .8;

  function layers() {
    var word = (document.getElementById('in-word').value || 'hello').trim() || 'hello';
    var name = (document.getElementById('in-name').value || 'Steven Pierre').trim() || 'Steven Pierre';
    var m = mask.getContext('2d'); m.clearRect(0, 0, TW, TH);
    m.fillStyle = '#0a0a0e'; m.fillRect(0, 0, TW, TH);
    m.globalCompositeOperation = 'destination-out'; m.fillStyle = '#000';
    fit(m, word, TW - 90, 340, 800, FF);
    var tm = m.measureText(word), asc = tm.actualBoundingBoxAscent || 120, dsc = tm.actualBoundingBoxDescent || 0;

    var d = detail.getContext('2d'); d.clearRect(0, 0, TW, TH); d.textBaseline = 'alphabetic'; d.textAlign = 'left';

    d.textAlign = 'right'; d.fillText('OCT 2026', TW - 48, 98); d.textAlign = 'left';
    d.fillStyle = '#fff'; fit(d, name, 360, 54, 800, FF); d.fillText(name, 48, 530);
    d.fillStyle = '#ffe600'; rrect(d, 48, 556, 140, 34, 17); d.fill();
    d.fillStyle = '#0a0a0e'; d.font = '500 17px ' + MONO; d.textAlign = 'center'; d.fillText('CREATOR', 118, 579); d.textAlign = 'left';
    d.fillStyle = 'rgba(255,255,255,.7)'; d.font = '500 20px ' + MONO; d.fillText('Builder & designer', 204, 579);
    var ex = TW - 48 - 62, ey = 538; d.strokeStyle = '#00e5ff'; d.lineWidth = 4;
    d.beginPath(); d.arc(ex, ey, 56, 0, 6.283); d.stroke();

    var F = [['ACCESS', 'All areas', 48], ['DAYS', 'Every day', 236], ['TRACK', 'Everything', 424]];
    F.forEach(function (f) { d.fillStyle = 'rgba(255,255,255,.55)'; d.font = '500 16px ' + MONO; d.fillText(f[0], f[2], 690); d.fillStyle = '#fff'; d.font = '800 24px ' + FF; d.fillText(f[1], f[2], 722); });
    d.strokeStyle = 'rgba(255,255,255,.35)'; d.lineWidth = 3; d.setLineDash([12, 10]); d.beginPath(); d.moveTo(24, STUB_Y); d.lineTo(TW - 24, STUB_Y); d.stroke(); d.setLineDash([]);
    var seed = 7; for (var q = 0; q < name.length; q++) seed = (seed * 31 + name.charCodeAt(q)) % 9973;

    d.fillStyle = '#fff'; var bx = 48; while (bx < TW - 52) { var bw = 2 + Math.floor(rnd() * 6); d.fillRect(bx, 806, bw, 80); bx += bw + 2 + Math.floor(rnd() * 5); }
    d.fillStyle = 'rgba(255,255,255,.7)'; d.font = '500 18px ' + MONO; d.fillText('SP-2026', 48, 920); d.textAlign = 'right'; d.fillStyle = '#ffe600'; d.fillText('FLIP FOR LINKS ↻', TW - 48, 920); d.textAlign = 'left';

  var tex = new THREE.CanvasTexture(face); tex.anisotropy = 4;
  var backTex = new THREE.CanvasTexture(back); backTex.anisotropy = 4;
  function paint(t, tot) {

  var BW = 2.4, BH = 3.6, TOPOFF = BH * .07;

  var S = 1, anchor = { x: 0, y: 0 }, pts = [], A, B, Ls, Hb, lastW = 0;

  });

  function sat(p, q, rest) {
