<style>
/* Layout: one screen. A black-and-gold anime pass hangs on a lanyard; flip it and each link is printed in its own show-off Japanese display face. */
:root {
  --ink: #050505;
  --panel: #0e0b05;
  --line: #3a2e10;
  --ivory: #f4ecd8;
  --muted: #a8966a;
  --gold: #d4af37;
  --gold-hi: #f6e27a;
  --gold-lo: #8a6a1c;
  --gold-grad: linear-gradient(135deg, #f6e27a 0%, #d4af37 45%, #8a6a1c 100%);
  --f-dela: "Dela Gothic One", "Arial Black", system-ui, sans-serif;
  --f-pixel: "DotGothic16", ui-monospace, Menlo, Consolas, monospace;
  --f-ramp: "Rampart One", "Dela Gothic One", system-ui, sans-serif;
  --f-train: "Train One", "Dela Gothic One", system-ui, sans-serif;
  --f-reggae: "Reggae One", "Dela Gothic One", system-ui, sans-serif;
  --f-mincho: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--ivory); font: 400 1rem/1.5 var(--f-body); overflow: hidden; overscroll-behavior: none; }
#stage, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#stage { z-index: 1; touch-action: none; }
#fx { z-index: 50; pointer-events: none; }
.glow { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(48rem 36rem at 0% 0%, rgba(212,175,55,.16), transparent 65%), radial-gradient(44rem 34rem at 100% 100%, rgba(212,175,55,.12), transparent 65%); }
.bgword { position: fixed; inset: 0; z-index: 0; display: grid; place-content: center; text-align: center; pointer-events: none; font: 400 clamp(3.2rem, 13.5vw, 14rem)/1 var(--f-dela); letter-spacing: -.02em; color: transparent; -webkit-text-stroke: 2px color-mix(in srgb, var(--gold) 20%, transparent); user-select: none; }
.vert { position: fixed; left: 1.25rem; top: 50%; transform: translateY(-50%); z-index: 2; writing-mode: vertical-rl; font: 400 1rem var(--f-pixel); letter-spacing: .5em; color: var(--gold); opacity: .7; pointer-events: none; display: none; }
@media (min-width: 900px) { .vert { display: block; } }

.promo { position: fixed; top: 0; left: 0; right: 0; z-index: 7; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .4rem .9rem; padding: .55rem 1rem; background: var(--gold-grad); color: #050505; font: 400 .95rem/1.3 var(--f-pixel); letter-spacing: .03em; text-align: center; }
.promo b { font: 400 1rem var(--f-dela); letter-spacing: 0; }
.promo button { font: 400 .85rem var(--f-dela); color: var(--gold-hi); background: #050505; border: 0; border-radius: 99px; padding: .45rem 1rem; cursor: pointer; }
.promo button.quiet { background: transparent; color: #050505; font: 400 .85rem var(--f-pixel); text-decoration: underline; padding: .3rem .4rem; }
.top, .bar { position: fixed; left: 0; right: 0; z-index: 4; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-inline: 1.25rem; font: 400 .9rem var(--f-pixel); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.top { top: var(--promo-h, 2.6rem); padding-block: 1rem; }
.live { display: inline-flex; align-items: center; gap: .55rem; color: var(--gold-hi); }
.live i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--gold-hi); animation: ping 1.4s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 var(--gold); } 80%, 100% { box-shadow: 0 0 0 .8rem transparent; } }

.bar { bottom: 0; padding-block: 1rem; flex-wrap: wrap; justify-content: center; background: linear-gradient(0deg, var(--ink) 30%, transparent); pointer-events: none; }
.bar > * { pointer-events: auto; }
.hint { margin: 0; text-transform: none; letter-spacing: .02em; font-size: .85rem; text-align: center; flex-basis: 100%; }
kbd { font: 400 .8rem var(--f-pixel); border: 1px solid var(--gold-lo); border-bottom-width: 3px; border-radius: .3rem; padding: .05rem .4rem; color: var(--gold-hi); }
.btn { font: 400 1rem var(--f-dela); letter-spacing: .02em; text-transform: none; padding: .8rem 1.5rem; border-radius: 99px; border: 2px solid var(--gold); color: var(--ink); background: var(--gold-grad); cursor: pointer; transition: box-shadow .2s, transform .2s; }
.btn:hover, .btn:focus-visible { box-shadow: 0 0 0 5px color-mix(in srgb, var(--gold) 35%, transparent), 0 0 38px color-mix(in srgb, var(--gold) 70%, transparent); }
.btn.ghost { background: transparent; color: var(--gold-hi); }
.edit { position: relative; }
.edit summary { list-style: none; }
.edit summary::-webkit-details-marker { display: none; }
.edit .panel { position: absolute; bottom: calc(100% + .7rem); left: 50%; transform: translateX(-50%); display: grid; gap: .6rem; width: min(86vw, 19rem); padding: .9rem; background: var(--panel); border: 2px solid var(--gold-lo); border-radius: .8rem; text-transform: none; letter-spacing: 0; }
.edit label { display: grid; gap: .25rem; font: 400 .8rem var(--f-pixel); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.edit input { font: 500 1rem var(--f-body); color: var(--ivory); background: var(--ink); border: 2px solid var(--line); border-radius: .5rem; padding: .5rem .65rem; width: 100%; }
.edit input:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 1px; border-color: var(--gold); }

/* Back of the badge: real links laid over the 3D card and moved with it each frame. */
.bwrap { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
.back { position: absolute; left: 0; top: 0; width: 640px; height: 960px; visibility: hidden; pointer-events: none; will-change: transform; color: var(--ivory); }
.back h2 { position: absolute; left: 56px; right: 56px; top: 104px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; font: 400 24px var(--f-pixel); letter-spacing: .12em; text-transform: uppercase; color: var(--gold-hi); }
.back h2 span:last-child { color: var(--muted); }
.links { position: absolute; left: 56px; right: 56px; top: 156px; display: grid; gap: 11px; }
.link { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 92px; padding: 0 26px; overflow: hidden; border: 2px solid var(--gold); border-radius: 12px; color: var(--ivory); text-decoration: none; pointer-events: auto; background: linear-gradient(90deg, rgba(212,175,55,.14), rgba(5,5,5,.8) 60%); transition: color .2s, background .2s; }
.link .nm { font-size: 44px; line-height: 1; white-space: nowrap; }
.link .tg { font: 400 18px var(--f-pixel); letter-spacing: .08em; color: var(--gold-hi); margin-left: auto; }
.link .ar { font: 400 28px var(--f-pixel); color: var(--gold); }
.link:hover, .link:focus-visible { background: var(--gold-grad); color: var(--ink); }
.link:hover .tg, .link:hover .ar, .link:focus-visible .tg, .link:focus-visible .ar { color: var(--ink); }
.link:focus-visible { outline: 4px solid var(--ivory); outline-offset: 3px; }
.order { position: absolute; left: 56px; right: 56px; top: 806px; display: grid; gap: 8px; justify-items: center; text-align: center; pointer-events: none; }
.order button { font: 400 24px var(--f-dela); color: #050505; background: var(--gold-grad); border: 0; border-radius: 99px; padding: 14px 28px; cursor: pointer; pointer-events: auto; }
.order button:focus-visible { outline: 4px solid var(--ivory); outline-offset: 3px; }
.order small { font: 400 17px var(--f-pixel); letter-spacing: .06em; color: var(--muted); }

.fallback { display: none; position: fixed; inset: 0; z-index: 6; overflow: auto; padding: 5rem 1.25rem; place-content: center; gap: .75rem; }
.fallback h1 { font: 400 clamp(2.2rem, 9vw, 4.5rem)/1 var(--f-dela); margin: 0 0 1rem; color: var(--gold-hi); }
.fallback .link { height: 4.2rem; max-width: 28rem; }
.fallback .link .nm { font-size: 1.8rem; }

.cursor { position: fixed; left: 0; top: 0; z-index: 60; width: 2.2rem; height: 2.2rem; margin: -1.1rem 0 0 -1.1rem; border: 2px solid var(--gold-hi); border-radius: 50%; pointer-events: none; mix-blend-mode: difference; transition: width .2s, height .2s, margin .2s, background .2s; display: none; }
.cursor.big { width: 4.5rem; height: 4.5rem; margin: -2.25rem 0 0 -2.25rem; background: var(--gold-hi); }
.cursor.grab { width: 3.6rem; height: 3.6rem; margin: -1.8rem 0 0 -1.8rem; border-color: var(--ivory); }
@media (pointer: fine) { .cursor { display: block; } body, a, button, summary { cursor: none; } }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 3px; }
@media (max-width: 600px) { .top { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; } }
</style>

<canvas id="stage" aria-hidden="true"></canvas>

<div class="promo" id="promo">

  <span><button type="button" data-order>Get yours</button> <button type="button" class="quiet" data-copy>Copy my email</button></span>
</div>

</div>

</div>

</nav>

<div class="bar">
  <p class="hint">Grab the pass and swing it. Tap it, or press <kbd>F</kbd>, to flip it over for my links.</p>
  <button class="btn" id="flip" type="button">Flip pass</button>
  <details class="edit">
    <summary class="btn ghost">Edit pass</summary>
    <div class="panel">
      <label for="in-word">Big word<input id="in-word" maxlength="7" value="ハロー" autocomplete="off"></label>
      <label for="in-name">Name<input id="in-name" maxlength="22" value="Steven Pierre" autocomplete="off"></label>
    </div>
  </details>
  <button class="btn ghost" id="reset" type="button">Reset</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine = window.matchMedia('(pointer: fine)').matches;
  var COLORS = ['#f6e27a', '#d4af37', '#8a6a1c', '#f4ecd8', '#ffd86b', '#fff7d6'];

  /* Edit your links here. Each prints on the back of the pass in its own display face. */
  var LINKS = [
    { name: 'Portfolio', tag: '作品', href: 'https://kiss42.github.io/newportfolio/', f: 'var(--f-reggae)' },
    { name: 'SoulSite', tag: '制作中', href: 'https://soulsite-roan.vercel.app', f: 'var(--f-train)' },
    { name: 'Threads', tag: 'スレッド', href: 'https://www.threads.com/@_papipierre', f: 'var(--f-ramp)' },
    { name: 'X', tag: 'つぶやき', href: 'https://x.com/mysticdesk', f: 'var(--f-dela)' },
    { name: 'Patreon', tag: '支援', href: 'https://www.patreon.com/c/Soulsite', f: 'var(--f-mincho); font-weight: 800' }
  ];
  function linkHTML(l) { return '<a class="link" target="_blank" rel="noopener noreferrer" href="' + l.href + '"><span class="nm" style="font-family: ' + l.f + '">' + l.name + '</span><span class="tg">' + l.tag + '</span><span class="ar">↗</span></a>'; }
  document.getElementById('links').innerHTML = LINKS.map(linkHTML).join('');
  document.getElementById('fallback').insertAdjacentHTML('beforeend', LINKS.map(linkHTML).join('') + '<button class="btn" type="button" data-order style="justify-self:start;margin-top:1rem">Get your own pass</button>');

  /* Contact: the address is never printed on the page. It is assembled when someone clicks. */
  function addr() { return String.fromCharCode(107,105,115,115,112,105,101,114,114,101,52,50) + String.fromCharCode(64) + ['gmail', 'com'].join('.'); }
  function orderMail() {
    var body = 'Hi Steven,\n\nI saw your link pass and I want one of my own.\n\nMy name:\nMy links (Instagram, X, Patreon, anything):\nColors and vibe:\nWhen I need it by:\n\nThanks!';
    location.href = 'mailto:' + addr() + '?subject=' + encodeURIComponent('I want my own link pass') + '&body=' + encodeURIComponent(body);
  }
  function copyMail(el) {
    var t = addr(), done = function () { var o = el.textContent; el.textContent = 'Copied'; setTimeout(function () { el.textContent = o; }, 1600); };
    var legacy = function () { var x = document.createElement('textarea'); x.value = t; x.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(x); x.select(); try { document.execCommand('copy'); done(); } catch (e) {} x.remove(); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, legacy); else legacy();
  }
  document.addEventListener('click', function (e) {
    var o = e.target.closest('[data-order]'), c = e.target.closest('[data-copy]');
    if (o) orderMail(); else if (c) copyMail(c);
  });
  var promo = document.getElementById('promo');
  function promoH() { document.documentElement.style.setProperty('--promo-h', promo.offsetHeight + 'px'); }
  addEventListener('resize', promoH); promoH();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(promoH);

  /* Cursor */
  var cur = document.getElementById('cursor'), cx = 0, cy = 0, px = 0, py = 0;
  if (fine && !reduce) {
    addEventListener('pointermove', function (e) { cx = e.clientX; cy = e.clientY; });
    (function follow() { px += (cx - px) * .22; py += (cy - py) * .22; cur.style.transform = 'translate(' + px + 'px,' + py + 'px)'; requestAnimationFrame(follow); })();
    document.querySelectorAll('a, button, summary').forEach(function (n) {
      n.addEventListener('pointerenter', function () { cur.classList.add('big'); });
      n.addEventListener('pointerleave', function () { cur.classList.remove('big'); });
    });
  }

  /* Gold confetti */
  var fx = document.getElementById('fx'), fc = fx.getContext('2d'), bits = [], fxOn = false;
  function fxSize() { fx.width = innerWidth; fx.height = innerHeight; }
  addEventListener('resize', fxSize); fxSize();
  function burst(x, y) {
    if (reduce) return;
    for (var i = 0; i < 70; i++) {
      var a = Math.random() * 6.283, s = 3 + Math.random() * 9;
      bits.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4, w: 5 + Math.random() * 7, hh: 3 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: COLORS[i % COLORS.length], life: 1 });
    }
    if (!fxOn) { fxOn = true; requestAnimationFrame(fxLoop); }
  }
  function fxLoop() {
    fc.clearRect(0, 0, fx.width, fx.height);
    bits = bits.filter(function (b) { return b.life > 0; });
    bits.forEach(function (b) {
      b.vy += .28; b.vx *= .985; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life -= .012;
      fc.save(); fc.globalAlpha = Math.max(b.life, 0); fc.translate(b.x, b.y); fc.rotate(b.r); fc.fillStyle = b.c; fc.fillRect(-b.w / 2, -b.hh / 2, b.w, b.hh); fc.restore();
    });
    if (bits.length) requestAnimationFrame(fxLoop); else { fxOn = false; fc.clearRect(0, 0, fx.width, fx.height); }
  }

  /* Warp + pass interaction hooks (filled in by the 3D section) */
  var warpHold = false, warp = 1, holdTimer;
  var hitBadge = function () { return false; }, startGrab = function () {}, endGrab = function () {}, flipBadge = function () {};
  var SKIP = 'a, button, summary, .edit, .promo, .back .order';
  addEventListener('keydown', function (e) {
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.code === 'Space' && !/^(BUTTON|A|SUMMARY)$/.test(e.target.tagName)) { e.preventDefault(); warpHold = true; }
    if (e.code === 'KeyF') flipBadge();
  });
  addEventListener('keyup', function (e) { if (e.code === 'Space') warpHold = false; });
  addEventListener('pointerdown', function (e) {
    if (e.target.closest(SKIP)) return;
    if (hitBadge(e.clientX, e.clientY)) { startGrab(e.clientX, e.clientY); return; }
    burst(e.clientX, e.clientY);
    warp = Math.max(warp, 9);
    clearTimeout(holdTimer); holdTimer = setTimeout(function () { warpHold = true; }, 350);
  });
  addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    if (t && !e.target.closest(SKIP) && hitBadge(t.clientX, t.clientY)) e.preventDefault();
  }, { passive: false });
  addEventListener('pointerup', function (e) { clearTimeout(holdTimer); warpHold = false; endGrab(e.clientX, e.clientY); });
  addEventListener('pointercancel', function () { clearTimeout(holdTimer); warpHold = false; endGrab(null); });

  /* ---------- 3D stage ---------- */
  var canvas = document.getElementById('stage');
  var mobile = window.matchMedia('(pointer: coarse)').matches || innerWidth < 800, pr = Math.min(devicePixelRatio, mobile ? 1.5 : 2);
  var renderer, ok = !!window.THREE;
  if (ok) { try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance' }); } catch (e) { ok = false; } }
  if (!ok) { document.getElementById('fallback').style.display = 'grid'; document.querySelector('.bar').style.display = 'none'; return; }
  renderer.setPixelRatio(pr);
  var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(45, 1, .1, 200);
  cam.position.z = 9;
  var HH = Math.tan(22.5 * Math.PI / 180) * 9, HW = HH;

  /* Gold dust streaks */
  var starGroup = new THREE.Group(); scene.add(starGroup);
  var N = mobile ? 400 : 900, SP = 60, sp = new Float32Array(N * 6), sx = new Float32Array(N), sy = new Float32Array(N), sz = new Float32Array(N), col = new Float32Array(N * 6);
  var pal = [[1, .89, .48], [.83, .69, .22], [1, .96, .8], [.54, .42, .11], [1, 1, 1]];
  for (var i = 0; i < N; i++) {
    var ang = Math.random() * 6.283, rad = 3.5 + Math.random() * 22;
    sx[i] = Math.cos(ang) * rad; sy[i] = Math.sin(ang) * rad; sz[i] = -Math.random() * SP + 10;
    var c = pal[i % pal.length];
    for (var k = 0; k < 2; k++) { col[i * 6 + k * 3] = c[0]; col[i * 6 + k * 3 + 1] = c[1]; col[i * 6 + k * 3 + 2] = c[2]; }
  }
  var sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  sg.setAttribute('color', new THREE.BufferAttribute(col, 3));
  starGroup.add(new THREE.LineSegments(sg, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: .55 })));

  /* ---------- Pass textures ---------- */
  var GOLD = '#d4af37', GOLD_HI = '#f6e27a', GOLD_LO = '#8a6a1c', IVORY = '#f4ecd8';
  var TW = 640, TH = 960;
  var F_DELA = '"Dela Gothic One", "Arial Black", Arial, sans-serif', F_PIX = '"DotGothic16", Menlo, Consolas, monospace', F_MIN = '"Shippori Mincho", "Hiragino Mincho ProN", serif', F_TRAIN = '"Train One", "Dela Gothic One", sans-serif';
  function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function fit(ctx, text, maxW, maxSize, weight, fam) { var z = maxSize; do { ctx.font = weight + ' ' + z + 'px ' + fam; z -= 4; } while (ctx.measureText(text).width > maxW && z > 12); }
  function star(ctx, x, y, r) { ctx.beginPath(); ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r); ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill(); }
  function seigaiha(ctx, alpha) {
    ctx.save(); ctx.strokeStyle = GOLD; ctx.globalAlpha = alpha; ctx.lineWidth = 2;
    for (var row = 0, y = 20; y < TH + 40; row++, y += 26) for (var x = (row % 2 ? 0 : -30); x < TW + 60; x += 60) for (var r = 28; r > 6; r -= 7) { ctx.beginPath(); ctx.arc(x, y, r, Math.PI, 0); ctx.stroke(); }
    ctx.restore();
  }
  function punch(c) {
    c.globalCompositeOperation = 'destination-out'; c.fillStyle = '#000';
    rrect(c, TW / 2 - 64, 38, 128, 28, 14); c.fill();
    c.beginPath(); c.arc(0, STUB_Y, 18, 0, 6.283); c.fill(); c.beginPath(); c.arc(TW, STUB_Y, 18, 0, 6.283); c.fill();
    c.globalCompositeOperation = 'source-over';
  }
  function frameLine(c) { c.strokeStyle = GOLD; c.lineWidth = 3; c.globalAlpha = .75; rrect(c, 16, 16, TW - 32, TH - 32, 34); c.stroke(); c.globalAlpha = .3; c.lineWidth = 2; rrect(c, 26, 26, TW - 52, TH - 52, 26); c.stroke(); c.globalAlpha = 1; }

  var face = mk(TW, TH), fctx = face.getContext('2d');
